<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keşfet Kutusu – Videolardaki Ürünler</title>
<meta name="description" content="Keşfet Kutusu videolarında gösterilen pratik ev ve mutfak ürünlerinin listesi ve bağlantıları.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --lacivert: #121D38;
    --lacivert-2: #25396A;
    --turuncu: #FF8A2B;
    --turuncu-koyu: #F06512;
    --kart: #ffffff;
    --yazi: #1b2440;
    --soluk: #6b7590;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Poppins, system-ui, sans-serif;
    background: #f3f5fa;
    color: var(--yazi);
  }
  header {
    background: linear-gradient(180deg, var(--lacivert-2), var(--lacivert));
    color: #fff;
    text-align: center;
    padding: 28px 16px 64px;
  }
  header img { width: 88px; height: 88px; border-radius: 50%; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  header h1 { margin: 12px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  header h1 span { color: var(--turuncu); }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  main { max-width: 720px; margin: -40px auto 0; padding: 0 16px 40px; }
  .ara {
    width: 100%; padding: 14px 18px; border-radius: 14px; border: none;
    font: 500 15px Poppins, sans-serif; box-shadow: 0 6px 20px rgba(18,29,56,.12);
    margin-bottom: 18px;
  }
  .ara:focus { outline: 3px solid var(--turuncu); }
  .liste { display: grid; gap: 14px; }
  .urun {
    display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center;
    background: var(--kart); border-radius: 18px; padding: 12px;
    box-shadow: 0 4px 14px rgba(18,29,56,.08);
  }
  .urun img {
    width: 112px; height: 112px; object-fit: contain; border-radius: 12px; background: #fff;
  }
  .no { font-size: 12px; font-weight: 700; color: var(--turuncu-koyu); }
  .urun h2 { margin: 2px 0 4px; font-size: 16px; line-height: 1.3; }
  .urun p { margin: 0 0 10px; font-size: 13px; color: var(--soluk); line-height: 1.45; }
  .dugme {
    display: inline-block; background: var(--turuncu); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px;
  }
  .dugme:active { background: var(--turuncu-koyu); }
  .bos { text-align: center; color: var(--soluk); padding: 24px; }
  footer { text-align: center; font-size: 12px; color: var(--soluk); padding: 0 16px 32px; line-height: 1.6; }
  @media (max-width: 380px) {
    .urun { grid-template-columns: 88px 1fr; }
    .urun img { width: 88px; height: 88px; }
  }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Keşfet Kutusu logosu">
  <h1>KEŞFET <span>KUTUSU</span></h1>
  <p>Videolarda gördüğün ürünler burada</p>
</header>
<main>
  <input class="ara" id="ara" type="search" placeholder="Ürün ara ya da numara yaz (ör. 3)" aria-label="Ürün ara">
  <div class="liste" id="liste"><div class="bos">Yükleniyor…</div></div>
</main>
<footer>
  Bu sayfa bağımsızdır; Trendyol ile resmi bir bağlantısı yoktur.<br>
  Fiyat ve stok bilgisi değişebilir, satın almadan önce ürün sayfasını kontrol et.
</footer>
<script>
  const liste = document.getElementById('liste');
  const ara = document.getElementById('ara');
  let urunler = [];

  const kucuk = s => (s || '').toLocaleLowerCase('tr');

  function ciz() {
    const q = kucuk(ara.value.trim());
    const gorunen = urunler.filter(u =>
      !q || String(u.no) === q.replace('#', '') || kucuk(u.ad + ' ' + u.aciklama + ' ' + u.arama_adi).includes(q)
    );
    if (!gorunen.length) {
      liste.innerHTML = '<div class="bos">Aradığın ürün bulunamadı.</div>';
      return;
    }
    liste.innerHTML = '';
    for (const u of gorunen) {
      const kart = document.createElement('article');
      kart.className = 'urun';
      kart.innerHTML = `
        <img loading="lazy" alt="">
        <div>
          <div class="no">#${u.no}</div>
          <h2></h2>
          <p></p>
          <a class="dugme" target="_blank" rel="noopener">Ürünü gör →</a>
        </div>`;
      kart.querySelector('img').src = u.gorsel;
      kart.querySelector('img').alt = u.ad;
      kart.querySelector('h2').textContent = u.ad;
      kart.querySelector('p').textContent = u.aciklama;
      kart.querySelector('a').href = u.link;
      liste.appendChild(kart);
    }
  }

  fetch('urunler.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(veri => {
      urunler = veri.map((u, i) => ({ ...u, no: i + 1 })).reverse();
      ciz();
    })
    .catch(() => { liste.innerHTML = '<div class="bos">Liste şu an yüklenemedi, biraz sonra tekrar dene.</div>'; });

  ara.addEventListener('input', ciz);
</script>
</body>
</html>
